registry: ghcr.io/snr-roko
imageTag: latest
imagePullPolicy: IfNotPresent

vote:
  replicas: 1
  port: 80
  service:
    type: NodePort
    port: 8080
    nodePort: 31000

result:
  replicas: 1
  port: 80
  service: 
    type: NodePort
    port: 8081
    nodePort: 31001

worker:
  replicas: 1

redis:
  replicas: 1
  image: redis:alpine
  port: 6379

db:
  replicas: 1
  image: postgres:15-alpine
  port: 5432
  user: postgres
  password: postgres