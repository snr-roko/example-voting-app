name: vote-ci

on:
    push:
        branches: [ main ]
        paths:
            - "vote/**"
            - ".github/workflows/vote-ci.yaml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            
            - name: Install dependencies
              run: pip install -r vote/requirements.txt

            - name: Syntax check
              run: python -m compileall vote