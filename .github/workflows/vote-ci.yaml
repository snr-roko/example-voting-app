name: vote-ci

on:
    push:
        branches: [ main ]
        paths:
            - "vote/**"
            - ".github/workflows/vote-ci.yaml"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            
            - name: Install dependencies
              run: pip install -r vote/requirements.txt

            - name: Syntax check
              run: python -m compileall vote
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                context: vote
                target: final
                push: true
                tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-vote:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max