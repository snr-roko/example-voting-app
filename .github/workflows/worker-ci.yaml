name: worker-ci

on:
    push:
        branches: [ main ]
        paths:
            - "worker/**"
            - ".github/workflows/worker-ci.yaml"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
              working-directory: worker
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                dotnet-version: "7.0.x"

            - name: Build
              run: dotnet build --nologo

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                context: worker
                target: final
                push: true
                tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-worker:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
    scan:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: aquasecurity/trivy-action@v0.36.0
              with: 
                image-ref: ghcr.io/${{ github.repository_owner }}/example-voting-app-worker:${{ github.sha }}
                severity: CRITICAL,HIGH
                exit-code: "1"
                ignore-unfixed: true